<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gizmo Engine</title>

  <link rel="icon" type="image/x-icon" href="resources/images/ico.png" />
  <link rel="preload" href="resources/font.woff" as="font" type="font/woff" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="script.js"></script>
</head>

<body>
  <gizmo-menubar id="menu" class="invisible">
    <gizmo-menu label="Scene">
      <gizmo-menu label="Models" id="menu-models"></gizmo-menu>
      <gizmo-menu-item name="open" title="Pick a model (.usda, .obj, .fbx) together with its textures">Open file...</gizmo-menu-item>
    </gizmo-menu>
    <gizmo-menu label="Shading">
      <gizmo-menu label="Modes">
        <gizmo-menu-item type="radio" name="lighting-mode" value="TRIANGLE" title="Lighting computed once per triangle">Triangle</gizmo-menu-item>
        <gizmo-menu-item type="radio" name="lighting-mode" value="VERTEX" title="Lighting computed per vertex and interpolated">Vertex</gizmo-menu-item>
        <gizmo-menu-item type="radio" name="lighting-mode" value="PIXEL" title="Lighting computed per pixel">Pixel</gizmo-menu-item>
      </gizmo-menu>
      <gizmo-menu-item type="checkbox" name="wireframe">Wireframe</gizmo-menu-item>
      <gizmo-menu-item type="checkbox" name="textured" checked>Textured</gizmo-menu-item>
    </gizmo-menu>
    <gizmo-menu label="Lighting">
      <gizmo-menu-item type="checkbox" name="lights" title="Show / hide the lights">Lights</gizmo-menu-item>
      <gizmo-menu-item type="checkbox" name="shadows" title="Shadows on / off">Shadows</gizmo-menu-item>
    </gizmo-menu>
    <gizmo-menu label="Display">
      <gizmo-menu-item type="checkbox" name="grid" title="Show / hide the ground grid">Grid</gizmo-menu-item>
      <gizmo-menu-item type="checkbox" name="hud" title="Show / hide scene, frame and camera info">HUD</gizmo-menu-item>
    </gizmo-menu>
    <gizmo-menu label="Filters">
      <gizmo-menu-item type="checkbox" name="filter" value="barrel">Barrel</gizmo-menu-item>
      <gizmo-menu-item type="checkbox" name="filter" value="fisheye">Fisheye</gizmo-menu-item>
    </gizmo-menu>
  </gizmo-menubar>
  <input type="file" id="open-file" multiple hidden
    accept=".usda,.usd,.usdc,.usdz,.obj,.mtl,.fbx,image/*" />
  <div id="canvas-container">
    <canvas width="320" height="240"></canvas>
    <dl id="hud" class="hidden">
      <dt>Scene</dt><dd id="hud-scene"></dd>
      <dt>FPS</dt><dd id="hud-fps"></dd>
      <dt>Verts</dt><dd id="hud-verts"></dd>
      <dt>Tris</dt><dd id="hud-tris"></dd>
      <dt>Mem</dt><dd id="hud-mem"></dd>
      <dt>Cam pos</dt><dd id="hud-cam-pos"></dd>
      <dt>Cam rot</dt><dd id="hud-cam-rot"></dd>
    </dl>
  </div>
  <div id="console">
    <div id="logs"></div>
  </div>

  <div id="controls" class="invisible">
    <div id="actions">
      <button id="previous" style="display: none" aria-label="previous">
        <svg width="100%" height="100%" viewBox="0 0 78 92" fill="var(--color-d)">
          <path
            d="M77.203,0l-48.281,28.494l-0,-28.494l-28.922,0l-0,91.299l28.922,0l-0,-28.666l48.281,28.494l0,-91.127Z" />
        </svg>
      </button>
      <button id="playpause" aria-label="playpause">
        <svg id="icon-play" width="100%" height="100%" viewBox="0 0 78 92" fill="var(--color-d)">
          <path d="M0,0l0,91.127l77.203,-45.563l-77.203,-45.564Z" />
        </svg>
        <svg id="icon-pause" width="100%" height="100%" viewBox="0 0 78 92" fill="var(--color-d)" style="display: none">
          <path d="M28.922,0l-28.922,0l0,91.299l28.922,0l-0,-91.299Zm48.281,0l-28.922,0l0,91.299l28.922,0l0,-91.299Z" />
        </svg>
      </button>
      <button id="next" aria-label="next">
        <svg width="100%" height="100%" viewBox="0 0 25 31" fill="var(--color-d)">
          <path
            d="M19.544,13.899l0,-13.85l5.303,0l0,30.671l-5.303,0l0,-13.948l-19.544,13.899l0,-30.671l19.544,13.899Z" />
        </svg>
      </button>
    </div>
    <div id="freqs">
      <canvas id="freq-canvas"></canvas>
    </div>
    <div id="tracks"></div>
  </div>

</body>

</html>
